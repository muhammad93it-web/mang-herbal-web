kind = "web"
previewPath = "/mang-herbal/"
title = "Mang Herbal — فرۆشگای ئۆنلاین"
version = "1.0.0"
id = "artifacts/mang-herbal"
router = "path"

[[services]]
name = "web"
paths = [ "/mang-herbal/" ]
localPort = 20106

[services.development]
run = "pnpm --filter @workspace/mang-herbal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mang-herbal", "run", "build" ]
serve = "static"
publicDir = "artifacts/mang-herbal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20106"
BASE_PATH = "/mang-herbal/"

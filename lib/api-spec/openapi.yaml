openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mang Herbal e-commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: categories
  - name: cart
  - name: orders
  - name: favorites
  - name: admin
  - name: stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Categories ────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # ── Products ──────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: minPrice
          in: query
          schema:
            type: ["integer", "null"]
        - name: maxPrice
          in: query
          schema:
            type: ["integer", "null"]
        - name: featured
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Cart ──────────────────────────────────────────────────────────────────
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current user's cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{productId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update item quantity in cart
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/clear:
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear the entire cart
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Orders ────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get current user's orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Favorites ─────────────────────────────────────────────────────────────
  /favorites:
    get:
      operationId: getFavorites
      tags: [favorites]
      summary: Get current user's favorite products
      responses:
        "200":
          description: Favorite products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /favorites/{productId}:
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add product to favorites
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove product from favorites
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Stats (wow endpoint) ──────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Public store statistics
      responses:
        "200":
          description: Store stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStats"

  # ── Admin ─────────────────────────────────────────────────────────────────
  /admin/products:
    get:
      operationId: adminGetProducts
      tags: [admin]
      summary: Admin list all products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Admin create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /admin/products/{id}:
    patch:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Admin update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Admin delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/orders:
    get:
      operationId: adminGetOrders
      tags: [admin]
      summary: Admin list all orders
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/orders/unseen-count:
    get:
      operationId: adminGetUnseenOrdersCount
      tags: [admin]
      summary: Count of orders not yet seen by admin
      responses:
        "200":
          description: Unseen order count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnseenCountResponse"

  /admin/orders/mark-seen:
    post:
      operationId: adminMarkOrdersSeen
      tags: [admin]
      summary: Mark all orders as seen
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/orders/{id}/status:
    patch:
      operationId: adminUpdateOrderStatus
      tags: [admin]
      summary: Admin update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using an admin-issued code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Site settings ─────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Public site settings (hero, footer, contact)
      responses:
        "200":
          description: Settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSetting"

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Admin list all site settings including private keys
      responses:
        "200":
          description: All settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSetting"
    put:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Admin bulk upsert site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSetting"

  /admin/whatsapp-test:
    post:
      operationId: adminTestWhatsApp
      tags: [admin]
      summary: Send a test WhatsApp message via CallMeBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTestInput"
      responses:
        "200":
          description: Result of the send attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTestResponse"

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Admin list registered users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/reset-code:
    post:
      operationId: adminCreateResetCode
      tags: [admin]
      summary: Admin generate a password reset code for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetCodeResponse"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin dashboard statistics
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    # ── Auth ────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [name, phone, email, password]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
        email:
          type: string
          # pattern instead of `format: email` — orval emits zod-v4 `zod.email()`
          # for the format, which breaks against the workspace's zod v3 import.
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        firstLogin:
          type: boolean
          description: True when this is the user's first ever login (used for the welcome message).

    User:
      type: object
      required: [id, name, phone, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [customer, admin]
        createdAt:
          type: string

    # ── Category ────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, slug, nameCkb, nameAr, nameEn]
      properties:
        id:
          type: integer
        slug:
          type: string
        nameCkb:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        productCount:
          type: integer

    # ── Product ─────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, nameCkb, nameAr, nameEn, descCkb, descAr, descEn, price, categorySlug, inStock, isFeatured, rating, createdAt]
      properties:
        id:
          type: integer
        nameCkb:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        descCkb:
          type: string
        descAr:
          type: string
        descEn:
          type: string
        price:
          type: integer
        oldPrice:
          type: ["integer", "null"]
        categorySlug:
          type: string
        imageUrl:
          type: ["string", "null"]
        badge:
          type: ["string", "null"]
        inStock:
          type: boolean
        isFeatured:
          type: boolean
        rating:
          type: number
        reviewCount:
          type: integer
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [nameCkb, nameAr, nameEn, descCkb, descAr, descEn, price, categorySlug]
      properties:
        nameCkb:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        descCkb:
          type: string
        descAr:
          type: string
        descEn:
          type: string
        price:
          type: integer
        oldPrice:
          type: ["integer", "null"]
        categorySlug:
          type: string
        imageUrl:
          type: ["string", "null"]
        badge:
          type: ["string", "null"]
        inStock:
          type: boolean
        isFeatured:
          type: boolean

    ProductUpdate:
      type: object
      properties:
        nameCkb:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        descCkb:
          type: string
        descAr:
          type: string
        descEn:
          type: string
        price:
          type: integer
        oldPrice:
          type: ["integer", "null"]
        categorySlug:
          type: string
        imageUrl:
          type: ["string", "null"]
        badge:
          type: ["string", "null"]
        inStock:
          type: boolean
        isFeatured:
          type: boolean

    # ── Cart ────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      required: [productId, quantity, product]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        product:
          $ref: "#/components/schemas/Product"

    Cart:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: integer

    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    # ── Order ────────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [productId, quantity, price, nameCkb, nameAr, nameEn]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
        price:
          type: integer
        nameCkb:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string

    Order:
      type: object
      required: [id, userId, status, total, phone, address, items, createdAt, isSeen]
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        total:
          type: integer
        customerName:
          type: ["string", "null"]
        isSeen:
          type: boolean
        phone:
          type: string
        address:
          type: string
        note:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [name, phone, address]
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        note:
          type: ["string", "null"]

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]

    UnseenCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    # ── Stats ────────────────────────────────────────────────────────────────
    StoreStats:
      type: object
      required: [totalProducts, totalCategories, totalOrders, happyCustomers]
      properties:
        totalProducts:
          type: integer
        totalCategories:
          type: integer
        totalOrders:
          type: integer
        happyCustomers:
          type: integer

    # ── Password reset ───────────────────────────────────────────────────────
    ResetPasswordInput:
      type: object
      required: [phone, code, newPassword]
      properties:
        phone:
          type: string
        code:
          type: string
        newPassword:
          type: string
          minLength: 6

    ResetCodeResponse:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
        expiresAt:
          type: string

    # ── Site settings ────────────────────────────────────────────────────────
    SiteSetting:
      type: object
      required: [key, valueCkb, valueAr, valueEn]
      properties:
        key:
          type: string
        valueCkb:
          type: string
        valueAr:
          type: string
        valueEn:
          type: string

    UpdateSettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SiteSetting"

    WhatsAppTestInput:
      type: object
      required: [phone, apiKey]
      properties:
        phone:
          type: string
        apiKey:
          type: string

    WhatsAppTestResponse:
      type: object
      required: [success, detail]
      properties:
        success:
          type: boolean
        detail:
          type: ["string", "null"]

    # ── Admin users & stats ──────────────────────────────────────────────────
    AdminUser:
      type: object
      required: [id, name, phone, email, role, createdAt, hasResetCode]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
        createdAt:
          type: string
        hasResetCode:
          type: boolean
        resetCode:
          type: ["string", "null"]
        resetCodeExpiresAt:
          type: ["string", "null"]

    AdminStats:
      type: object
      required: [totalOrders, pendingOrders, deliveredOrders, totalRevenue, totalUsers, totalProducts, totalFavorites]
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        deliveredOrders:
          type: integer
        totalRevenue:
          type: integer
        totalUsers:
          type: integer
        totalProducts:
          type: integer
        totalFavorites:
          type: integer
